; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200

; Traffic controller: owns the intersection logic
[env:master]
build_src_filter = +<master/>

; Traffic controller: switches the LEDs for one approach
[env:slave]
build_src_filter = +<slave/>

; Practice assignment: blink the built-in LED
[env:blink]
build_src_filter = +<basics/blink/>

; Practice assignment: read the MAC address of this board
[env:mac_address]
build_src_filter = +<basics/mac_address/>

; Practice assignment: ESP-NOW sender, greets the slave and prints its reply
[env:espnow_master]
build_src_filter = +<basics/espnow_master/>

; Practice assignment: ESP-NOW receiver, answers the master's greeting
[env:espnow_slave]
build_src_filter = +<basics/espnow_slave/>

; Hardware test: walks every signal head of this slave (red, orange, green)
[env:signal_head_test]
build_src_filter = +<basics/signal_head_test/>

; Hardware test: switches every slave LED on, to check that all LEDs work
[env:all_on]
build_src_filter = +<basics/all_on/>

; Hardware test: drives chosen pins through serial commands, to trace wiring
[env:pin_scan]
build_src_filter = +<basics/pin_scan/>

; Hardware test: measures the voltage over each LED, to find a missing LED
[env:led_voltage]
build_src_filter = +<basics/led_voltage/>
