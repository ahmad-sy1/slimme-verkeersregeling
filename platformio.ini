; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200

; Traffic controller: owns the intersection logic
[env:master]
build_src_filter = +<master/>

; Traffic controller: switches the LEDs for one approach
[env:slave]
build_src_filter = +<slave/>

; Practice assignment: blink the built-in LED
[env:blink]
build_src_filter = +<basics/blink/>

; Practice assignment: read the MAC address of this board
[env:mac_address]
build_src_filter = +<basics/mac_address/>
