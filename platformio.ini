; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200

; Traffic controller: owns the intersection logic
[env:master]
build_src_filter = +<master/>

; Traffic controller: switches the LEDs for one approach
[env:slave]
build_src_filter = +<slave/>

; Practice assignment: blink the built-in LED
[env:blink]
build_src_filter = +<basics/blink/>

; Practice assignment: read the MAC address of this board
[env:mac_address]
build_src_filter = +<basics/mac_address/>

; Practice assignment: ESP-NOW sender, greets the slave and prints its reply
[env:espnow_master]
build_src_filter = +<basics/espnow_master/>

; Practice assignment: ESP-NOW receiver, answers the master's greeting
[env:espnow_slave]
build_src_filter = +<basics/espnow_slave/>

; Hardware test: blink one GPIO at a time to match LEDs to poles
[env:pin_scan]
build_src_filter = +<basics/pin_scan/>

; Hardware test: blink all candidate GPIOs together to see which LEDs light up
[env:led_test]
build_src_filter = +<basics/led_test/>
