; Slim kruispunt - simpele tijdgestuurde versie (geen sensoren)
;
; 1 project, 3 boards. Kies de env van het board dat aan USB hangt:
;   master          -> het brein: bepaalt de fases en stuurt ze via ESP-NOW
;   slave_hoofdweg  -> stuurt de 4 lichten van de hoofdweg aan
;   slave_zijweg    -> stuurt de 4 lichten van de zijweg aan
;
; Pin-test (controleer bedrading, zie Serial Monitor):
;   test_hoofdweg / test_zijweg -> loopt elk licht af: rood, geel, groen

[platformio]
default_envs = master

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:master]
upload_port = COM7
monitor_port = COM7
build_src_filter = +<master/>

[env:slave_hoofdweg]
upload_port = COM9
monitor_port = COM9
build_src_filter = +<slave_hoofdweg/>

[env:slave_zijweg]
build_src_filter = +<slave_zijweg/>

[env:test_hoofdweg]
upload_port = COM9
monitor_port = COM9
build_src_filter = +<slave_hoofdweg/>
build_flags = -DPINTEST

[env:test_zijweg]
build_src_filter = +<slave_zijweg/>
build_flags = -DPINTEST

[env:pinscan]
build_src_filter = +<pinscan/>

[env:volgorde]
build_src_filter = +<volgorde/>

[env:allesaan]
build_src_filter = +<allesaan/>

[env:ledmeting]
build_src_filter = +<ledmeting/>
